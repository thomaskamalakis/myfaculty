{% if delete_url %}

<div class="row">
<div class="col text-center landing-button-col ">        
        <a class="nav-link-icon" onclick="delete_obj(); return false;" href="#" > <span class="mto" style="font-size: 20pt;"> report</span> <div class="btn btn-danger submit-app-div">Διαγραφή Αίτησης</div> </a>
    </div>
</div>
<script>
    function sweetConfirm(message, confirmText="{% trans 'Εντάξει' %}", cancelText="{% trans 'Άκυρο' %}") {
    return Swal.fire({
        text: message,
        icon: "warning",
        showCancelButton: true,
        confirmButtonText: confirmText,
        cancelButtonText: cancelText,
        confirmButtonColor: "#d33",
        reverseButtons: true
    }).then((result) => {
        return result.isConfirmed;
    });
    }
    async function delete_obj() {
    var result = await sweetConfirm(
        "{% trans 'Είστε σίγουροι; Θα διαγραφούν όλα τα στοιχεία της αίτησης σας!' %}",
        "{% trans 'Διαγραφή Αίτησης!' %}",
        "{% trans 'Άκυρο!' %}"        
    );
    if (result) {
      window.location.replace('{{ delete_url }}');      
    }
    }
</script>  
{% endif %}
